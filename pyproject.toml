[build-system]
requires = ["setuptools==80.1.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "voxlush-gen"
version = "1.0.0"
description = "Evidence-bound Minecraft voxel dataset generation"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
 "fastapi==0.115.12", "uvicorn==0.34.2", "pydantic==2.11.4",
 "httpx==0.28.1", "apsw==3.51.3.0", "numpy==2.2.5",
 "scipy==1.15.3", "Pillow==11.2.1", "jsonschema==4.23.0"
]
[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "ruff==0.11.8"]
[project.scripts]
voxlush = "voxlush.cli:main"
[tool.setuptools.packages.find]
where = ["backend/src"]
[tool.setuptools.package-data]
voxlush = ["voxel/resources/*", "themes/*.json", "dataset/resources/*"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"backend/src/voxlush/voxel/resources/legacy_quality.py" = ["E401", "E701", "E702"]
"backend/src/voxlush/voxel/resources/legacy_render.py" = ["E401", "E702", "F401"]
"backend/src/voxlush/voxel/resources/legacy_wooden.py" = ["E701", "E702"]
